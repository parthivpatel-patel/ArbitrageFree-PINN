name: Institutional CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch numpy pandas pytest pybind11 setuptools

    - name: Build C++ Quant Math Extension
      run: |
        python setup.py build_ext --inplace

    - name: Run Pytest Suite
      env:
        PYTHONPATH: "."
      run: |
        pytest tests/
